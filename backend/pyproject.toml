[project]
name = "coreflow-backend"
version = "0.1.0"
description = "Coreflow — central business management system (CRM, projects, time tracking, invoicing, finance)"
readme = "README.md"
requires-python = ">=3.13,<3.14"

dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.16",
    "django-cors-headers>=4.7",
    "django-filter>=25.1",
    "drf-spectacular>=0.28",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "celery>=5.5",
    "django-celery-beat>=2.8",
    "django-celery-results>=2.6",
    "environs[django]>=14.1",
    "gunicorn>=23.0",
    "whitenoise>=6.9",
    "httpx>=0.28",
    "pydantic>=2.11",
    "python-dateutil>=2.9",
    "icalendar>=6.1",
    "boto3>=1.37",
    "django-storages>=1.14",
    # reportlab (pure Python) rather than WeasyPrint: no native Pango/Cairo
    # dependency, so tests and PDF export run on Windows hosts as well as Docker.
    "reportlab>=4.3",
    "structlog>=25.2",
    "django-structlog>=9.1",
    "django-ratelimit>=4.1",
    "django-csp>=4.0",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.10",
    "pytest-cov>=6.1",
    "pytest-mock>=3.14",
    "respx>=0.22",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "ruff>=0.11",
    "mypy>=1.15",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs[compatible-mypy]>=3.15",
    "types-python-dateutil>=2.9",
    "boto3-stubs[s3]>=1.37",
    "django-debug-toolbar>=5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "apps"]

[tool.uv]
default-groups = []

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "DJ",   # flake8-django
    "S",    # flake8-bandit
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "S101",  # assert is fine (pytest)
    "B008",  # function call in default arg — common in DRF
    "RUF012",  # mutable class attrs need ClassVar — noisy with Django Meta
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S311"]
"**/conftest.py" = ["S105", "S106"]
"**/settings/*.py" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
testpaths = ["apps"]
filterwarnings = [
    "error::DeprecationWarning:apps.*",
]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/"]
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_decorators = false
show_error_codes = true

[[tool.mypy.overrides]]
module = ["*.migrations.*"]
ignore_errors = true

# Celery ships no py.typed marker and has no stubs package.
[[tool.mypy.overrides]]
module = ["celery.*", "django_celery_beat.*", "django_celery_results.*", "storages.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"
